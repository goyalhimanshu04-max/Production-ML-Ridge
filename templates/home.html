<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: linear-gradient(to right, #fc4a1a, #f7b733);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            background: white;
            padding: 40px;
            width: 550px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        form input{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button{
            width: 100%;
            padding: 14px;
            border: none;
            background: #fc4a1a;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #f7b733;
            color: black;
        }

        .result{
            margin-top: 20px;
            text-align: center;
            font-size: 22px;
            color: #222;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🔥 FWI Prediction</h1>

        <form action="/predictdata" method="POST">

            <input type="number" step="any" name="Temperature" placeholder="Temperature" required>

            <input type="number" step="any" name="RH" placeholder="Relative Humidity (RH)" required>

            <input type="number" step="any" name="Ws" placeholder="Wind Speed (Ws)" required>

            <input type="number" step="any" name="Rain" placeholder="Rain" required>

            <input type="number" step="any" name="FFMC" placeholder="FFMC" required>

            <input type="number" step="any" name="DMC" placeholder="DMC" required>

            <input type="number" step="any" name="ISI" placeholder="ISI" required>

            <input type="number" step="any" name="Classes" placeholder="Classes (0 or 1)" required>

            <input type="number" step="any" name="Region" placeholder="Region" required>

            <button type="submit">
                Predict FWI
            </button>

        </form>

        {% if results %}

        <div class="result">
            Predicted FWI : {{ results }}
        </div>

        {% endif %}

    </div>

</body>

</html>
