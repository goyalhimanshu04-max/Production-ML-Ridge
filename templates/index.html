<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algerian Forest Fire Prediction</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #ff512f, #dd2476);
        }

        .container{
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 500px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        h1{
            margin-bottom: 20px;
            color: #333;
        }

        p{
            margin-bottom: 25px;
            color: #555;
            line-height: 1.6;
        }

        .btn{
            text-decoration: none;
            background: #ff512f;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn:hover{
            background: #dd2476;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🔥 Algerian Forest Fire Prediction</h1>

        <p>
            This Machine Learning web application predicts the 
            Fire Weather Index (FWI) using Ridge Regression Model.
        </p>

        <a href="/predictdata" class="btn">
            Predict Now
        </a>
    </div>

</body>
</html>
